services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is missing in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is missing in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-container-volume:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 5
volumes:
  postgres-container-volume:
